name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm comes from the packageManager field in package.json, so the version is pinned in one place.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      # The door gate in three browsers: what is pinned there (the state cookie on the door's cross-site POST, the
      # session kept from its response) is decided by each browser, not by the gate.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run e2e
      # Installs the packed packages into an empty project and uses every entry point, which is the one place a
      # package meets the dependencies a consumer's install resolves for it.
      - run: pnpm run smoke:packed
